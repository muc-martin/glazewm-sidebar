name: Windows build and installer tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the versioned release after tests pass
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test isolated installer lifecycle
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: powershell
        run: ./scripts/Package.ps1
      - name: Prepare standalone executable
        shell: pwsh
        run: |
          Copy-Item build/Release/native-sidebar.exe dist/native-sidebar.exe
          $hash = (Get-FileHash dist/native-sidebar.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  native-sidebar.exe" | Set-Content -Encoding ascii dist/native-sidebar.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: native-sidebar-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256

  release:
    needs: windows
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    env:
      RELEASE_TAG: v0.1.0
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-sidebar-windows-x64
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check *.sha256
      - name: Create release with downloads
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.exe dist/*.sha256 \
            --target "$GITHUB_SHA" --title "Native Sidebar $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
