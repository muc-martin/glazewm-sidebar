name: Windows build and installer tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test isolated installer lifecycle
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: powershell
        run: ./scripts/Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: native-sidebar-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
